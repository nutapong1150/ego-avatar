<!doctype html>
<!-- โครงวิดีโอวาดด้วยโค้ด (สกิล creative-coding-video) · คัดลอกไปข้างไฟล์ธีมของแบรนด์แล้วแก้
     ดูเฟรมเดียว: เปิด ?t=วินาที · เรนเดอร์: node <skill>/render-video.mjs "this.html?code=X" out.mp4 30 -->
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">   <!-- โทเคนแบรนด์ (--bg --fg --accent --font …) ห้ามตั้งสีเอง -->
<style>
  html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: var(--bg); }
  .stage { position: relative; width: 1080px; height: 1920px; }
  /* ทุกฉากวางทับกัน · ใช้ .stage > .layer ให้ชนะกฎ flow ของไฟล์ธีมภาพนิ่ง (เช่น .slide > :not(canvas)) */
  .stage > .layer { position: absolute; left: 84px; right: 84px; opacity: 0; z-index: 1; }
  .stage > canvas { position: absolute; inset: 0; z-index: 0; }
  .h { font: 600 78px/1.35 var(--font); }      /* ไทยตัวใหญ่ line-height ≥ 1.35 สระไม่ชน */
  .h em { font-style: normal; color: var(--accent); }
</style>
<div class="stage">
  <canvas id="art" width="1080" height="1920"></canvas>
  <div class="layer h" id="s1" style="top:300px">ประโยคปัญหา<br>ที่คนดูพูดเอง</div>
  <div class="layer h" id="s2" style="top:300px">ทางออก <em>คำเดียว</em></div>
</div>
<script src="music.js"></script>   <!-- คัดลอก music.js ของสกิลมาข้างไฟล์ -->
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));                     // 0→1 ระหว่างวินาที a–b
const out = (p) => 1 - Math.pow(1 - p, 3);                               // easeOutCubic
const back = (p) => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }; // เด้ง
const show = (el, o, dy = 0, s = 1) => { el.style.opacity = o; el.style.transform = `translateY(${dy}px) scale(${s})`; };
const rise = (el, t, a, d = 0.5, dist = 40) => { const p = out(seg(t, a, a + d)); show(el, p, (1 - p) * dist); return p; };
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const q = new URLSearchParams(location.search);
// สุ่มแบบมี seed เท่านั้น (ห้าม Math.random — ทุกเฟรมต้องออกเหมือนเดิม)
const rnd = ((a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; })(Number(q.get("seed") ?? 1));

// เสียง — เวลาเดียวกับภาพด้านล่าง · ไฟล์ SFX คัดจากคลัง media-use (Pixabay) มาไว้ข้างหน้า + CREDITS
window.SFX = [
  [0.2, "sfx/whoosh-short.mp3", 0.35],
  [3.0, "sfx/pop.mp3", 0.45],
];
// เพลงพื้น 96 BPM (0.625 วิ/จังหวะ) — ตั้งจุดเปลี่ยนฉากให้ตรงจังหวะ เช่น 5.0 = จังหวะที่ 8
window.BGM = () => music.render({ sec: 6, bright: [[3, 6]], drums: [[3, 6]], bass: [[3, 6]], hats: [[0, 6]] });
window.BGM_VOL = 0.5;

window.render = (t) => {                     // ฟังก์ชันเดียวของเวลา: ห้ามเก็บ state ข้ามเฟรม
  const g = $("art").getContext("2d");
  g.clearRect(0, 0, 1080, 1920);
  const f1 = seg(t, 2.6, 3.0);
  rise($("s1"), t, 0.2); if (t > 0.2) $("s1").style.opacity = out(seg(t, 0.2, 0.7)) * (1 - f1);
  rise($("s2"), t, 3.0);
  // canvas: วาดจากตำแหน่ง DOM จริงด้วย getBoundingClientRect() (offsetTop อิงพ่อที่ position ไม่ใช่ทั้งจอ)
};

window.ready = (async () => {
  // canvas ไม่โหลดฟอนต์เอง · ส่งตัวไทยด้วย ไม่งั้นได้แค่ชุดละติน (Google Fonts แยก unicode-range)
  const fam = css("--font").split(",")[0].replace(/['"]/g, "").trim() || "sans-serif";
  await Promise.all(["400", "500", "600"].map((w) => document.fonts.load(`${w} 26px "${fam}"`, "กขค ทดสอบ 30")));
  await document.fonts.ready;
  render(Number(q.get("t") ?? 1));
  return true;
})();
</script>
